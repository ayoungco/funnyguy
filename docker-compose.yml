version: '3'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile    # Specify the path to your custom Dockerfile
    image: php:7.4-apache   # Replace with the PHP version you need
    ports:
      - "8111:80"          # host:container
    volumes:
      - ./public:/var/www/html   # Replace 'your-php-app' with your app's directory
