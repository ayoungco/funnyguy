<VirtualHost *:80>
	ServerName www.fgcomics.com
	ServerAlias fgcomics.com
	RedirectMatch permanent ^/(.*)$ https://www.fgcomics.com/$1
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName www.fgcomics.com
	ServerAlias fgcomics.com
	ServerAdmin mr.adam.young@outlook.com
	DocumentRoot /srv/funny-guy-comics/

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/www.fgcomics.com-0001/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/www.fgcomics.com-0001/privkey.pem
</VirtualHost>
</IfModule>
